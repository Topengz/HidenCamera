<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<title>Kamera</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== SETUP SCREEN ===== */
  #setupScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #0a0a0a;
    padding: 30px;
    gap: 20px;
  }

  .app-title {
    font-size: 13px;
    letter-spacing: 4px;
    color: #444;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .big-icon {
    font-size: 52px;
    margin-bottom: 5px;
  }

  .section-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: #555;
    text-transform: uppercase;
    align-self: flex-start;
    width: 100%;
    max-width: 320px;
    margin-bottom: -10px;
  }

  .duration-box {
    width: 100%;
    max-width: 320px;
    background: #111;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .duration-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .duration-label {
    font-size: 12px;
    color: #888;
    letter-spacing: 1px;
  }

  .duration-value {
    font-size: 22px;
    color: #fff;
    font-weight: bold;
    min-width: 70px;
    text-align: right;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .adj-btn {
    background: #1e1e1e;
    border: 1px solid #333;
    color: #ccc;
    border-radius: 8px;
    width: 38px;
    height: 38px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .adj-btn:active { background: #2a2a2a; }

  .presets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .preset-btn {
    background: #161616;
    border: 1px solid #2a2a2a;
    color: #777;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .preset-btn:active, .preset-btn.active {
    background: #1f1f1f;
    border-color: #555;
    color: #ddd;
  }

  .unlimited-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toggle {
    width: 44px;
    height: 24px;
    background: #222;
    border-radius: 12px;
    position: relative;
    cursor: pointer;
    border: 1px solid #333;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle.on { background: #2d6a2d; border-color: #3a8a3a; }
  .toggle::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    background: #555;
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: all 0.2s;
  }
  .toggle.on::after { left: 22px; background: #7fff7f; }

  .start-btn {
    width: 100%;
    max-width: 320px;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #eee;
    border-radius: 14px;
    padding: 16px;
    font-size: 13px;
    letter-spacing: 3px;
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .start-btn:active {
    background: #222;
    border-color: #555;
  }

  .info-text {
    font-size: 10px;
    color: #333;
    text-align: center;
    letter-spacing: 1px;
    max-width: 280px;
    line-height: 1.6;
  }

  /* ===== RECORDING SCREEN ===== */
  #recordScreen {
    display: none;
    height: 100vh;
    width: 100vw;
    background: #000;
    position: relative;
  }

  #videoEl {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0; left: 0;
    opacity: 0;
  }

  /* Overlay gelap — kelihatan seperti layar mati */
  #darkOverlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 10;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #overlayHint {
    font-size: 10px;
    color: #111;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.5s;
  }
  #darkOverlay:active #overlayHint { color: #222; }

  /* HUD kecil di pojok */
  #hud {
    position: absolute;
    bottom: 20px;
    right: 16px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #hud.visible { opacity: 1; }

  .hud-dot {
    width: 8px;
    height: 8px;
    background: #f00;
    border-radius: 50%;
    animation: blink 1s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .hud-time {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 2px;
  }

  /* Stop button tersembunyi — tap 3x di pojok kiri bawah */
  #stopZone {
    position: absolute;
    bottom: 0; left: 0;
    width: 80px; height: 80px;
    z-index: 30;
    background: transparent;
  }

  /* ===== DONE SCREEN ===== */
  #doneScreen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #0a0a0a;
    padding: 30px;
    gap: 18px;
  }

  .done-icon { font-size: 48px; }
  .done-title {
    font-size: 14px;
    letter-spacing: 3px;
    color: #aaa;
    text-transform: uppercase;
  }
  .done-sub {
    font-size: 11px;
    color: #444;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.7;
    max-width: 280px;
  }

  .action-btn {
    width: 100%;
    max-width: 300px;
    background: #141414;
    border: 1px solid #2a2a2a;
    color: #ccc;
    border-radius: 12px;
    padding: 14px;
    font-size: 12px;
    letter-spacing: 2px;
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    text-decoration: none;
    display: block;
    -webkit-tap-highlight-color: transparent;
  }
  .action-btn:active { background: #1e1e1e; border-color: #444; }
  .action-btn.primary {
    background: #0f1f0f;
    border-color: #2a4a2a;
    color: #7fff7f;
  }

  #downloadLink { display: none; }
</style>
</head>
<body>

<!-- ===== SETUP SCREEN ===== -->
<div id="setupScreen">
  <div class="app-title">Kamera Pribadi</div>
  <div class="big-icon">⬛</div>

  <div class="section-label">Durasi Rekam</div>
  <div class="duration-box">
    <div class="duration-row">
      <span class="duration-label">MENIT</span>
      <div class="btn-row">
        <button class="adj-btn" onclick="adj('m',-1)">−</button>
        <div class="duration-value" id="minVal">00</div>
        <button class="adj-btn" onclick="adj('m',1)">+</button>
      </div>
    </div>
    <div class="duration-row">
      <span class="duration-label">DETIK</span>
      <div class="btn-row">
        <button class="adj-btn" onclick="adj('s',-5)">−</button>
        <div class="duration-value" id="secVal">30</div>
        <button class="adj-btn" onclick="adj('s',5)">+</button>
      </div>
    </div>
    <div class="presets">
      <button class="preset-btn" onclick="setPreset(0,30)">30d</button>
      <button class="preset-btn" onclick="setPreset(1,0)">1m</button>
      <button class="preset-btn" onclick="setPreset(3,0)">3m</button>
      <button class="preset-btn" onclick="setPreset(5,0)">5m</button>
      <button class="preset-btn" onclick="setPreset(10,0)">10m</button>
      <button class="preset-btn" onclick="setPreset(30,0)">30m</button>
    </div>
    <div class="unlimited-row">
      <span class="duration-label">TANPA BATAS</span>
      <div class="toggle-wrap">
        <span id="unlimitedLabel" style="font-size:11px;color:#555">OFF</span>
        <div class="toggle" id="unlimitedToggle" onclick="toggleUnlimited()"></div>
      </div>
    </div>
  </div>

  <button class="start-btn" onclick="startCamera()">▶ MULAI REKAM</button>

  <div class="info-text">
    layar akan gelap saat merekam<br>
    tap 3× pojok kiri bawah untuk stop<br>
    video tersimpan otomatis di galeri
  </div>
</div>

<!-- ===== RECORD SCREEN ===== -->
<div id="recordScreen">
  <video id="videoEl" autoplay playsinline muted></video>
  <div id="darkOverlay">
    <span id="overlayHint">ketuk untuk lihat status</span>
  </div>
  <div id="hud">
    <div class="hud-dot"></div>
    <div class="hud-time" id="hudTime">00:00</div>
  </div>
  <!-- Area tap 3x untuk stop (pojok kiri bawah) -->
  <div id="stopZone"></div>
</div>

<!-- ===== DONE SCREEN ===== -->
<div id="doneScreen" style="display:none;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0a0a0a;padding:30px;gap:18px;">
  <div class="done-icon">✅</div>
  <div class="done-title">Rekaman Selesai</div>
  <div class="done-sub" id="doneInfo">Video siap disimpan.</div>
  <a class="action-btn primary" id="downloadLink">⬇ SIMPAN VIDEO</a>
  <button class="action-btn" onclick="resetApp()">↩ REKAM LAGI</button>
</div>

<a id="hiddenDL" style="display:none"></a>

<script>
  let mins = 0, secs = 30, unlimited = false;
  let mediaRecorder, stream, chunks = [];
  let elapsed = 0, timerInterval, countdownTimeout;
  let tapCount = 0, tapTimer;
  let hudVisible = false, hudHideTimer;

  // ===== SETUP =====
  function adj(type, delta) {
    if (unlimited) return;
    if (type === 'm') {
      mins = Math.max(0, Math.min(59, mins + delta));
    } else {
      secs = Math.max(0, Math.min(55, secs + delta));
      // snap ke kelipatan 5
      secs = Math.round(secs / 5) * 5;
      if (secs >= 60) { secs = 0; mins = Math.min(59, mins + 1); }
    }
    // Jika keduanya 0, paksa minimal 5 detik
    if (mins === 0 && secs === 0 && !unlimited) secs = 5;
    render();
  }

  function setPreset(m, s) {
    if (unlimited) { toggleUnlimited(); }
    mins = m; secs = s;
    render();
  }

  function toggleUnlimited() {
    unlimited = !unlimited;
    document.getElementById('unlimitedToggle').classList.toggle('on', unlimited);
    document.getElementById('unlimitedLabel').textContent = unlimited ? 'ON' : 'OFF';
    document.getElementById('minVal').style.opacity = unlimited ? '0.3' : '1';
    document.getElementById('secVal').style.opacity = unlimited ? '0.3' : '1';
  }

  function render() {
    document.getElementById('minVal').textContent = String(mins).padStart(2,'0');
    document.getElementById('secVal').textContent = String(secs).padStart(2,'0');
  }
  render();

  // ===== START KAMERA =====
  async function startCamera() {
    if (mins === 0 && secs === 0 && !unlimited) {
      alert('Atur durasi dulu ya!');
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: true
      });
    } catch(e) {
      // fallback tanpa exact
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: true
        });
      } catch(e2) {
        alert('Tidak bisa akses kamera: ' + e2.message);
        return;
      }
    }

    document.getElementById('videoEl').srcObject = stream;

    // Pilih codec
    let mime = '';
    const types = ['video/webm;codecs=h264','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
    for (let t of types) {
      if (MediaRecorder.isTypeSupported(t)) { mime = t; break; }
    }

    mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
    chunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = handleStop;
    mediaRecorder.start(1000);

    // Ganti layar
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('recordScreen').style.display = 'block';

    // Timer elapsed
    elapsed = 0;
    timerInterval = setInterval(() => {
      elapsed++;
      updateHud();
    }, 1000);

    // Auto stop
    if (!unlimited) {
      const total = (mins * 60) + secs;
      countdownTimeout = setTimeout(stopRecording, total * 1000);
    }

    // Setup tap stop zone
    setupStopZone();

    // Tap overlay untuk show/hide HUD
    document.getElementById('darkOverlay').addEventListener('click', toggleHud);
  }

  function updateHud() {
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('hudTime').textContent =
      String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function toggleHud() {
    const hud = document.getElementById('hud');
    hudVisible = !hudVisible;
    hud.classList.toggle('visible', hudVisible);
    if (hudVisible) {
      clearTimeout(hudHideTimer);
      hudHideTimer = setTimeout(() => {
        hudVisible = false;
        hud.classList.remove('visible');
      }, 3000);
    }
  }

  // Tap 3x pojok kiri bawah untuk stop
  function setupStopZone() {
    const zone = document.getElementById('stopZone');
    zone.addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      if (tapCount >= 3) {
        tapCount = 0;
        stopRecording();
      } else {
        tapTimer = setTimeout(() => { tapCount = 0; }, 800);
      }
    });
  }

  function stopRecording() {
    clearInterval(timerInterval);
    clearTimeout(countdownTimeout);
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }
  }

  function handleStop() {
    const ext = chunks[0] && chunks[0].type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type: chunks[0] ? chunks[0].type : 'video/webm' });
    const url = URL.createObjectURL(blob);
    const now = new Date();
    const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
    const filename = `RekamPribadi_${ts}.${ext}`;

    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('doneInfo').textContent =
      `Durasi: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} · Format: ${ext.toUpperCase()}`;

    const dl = document.getElementById('downloadLink');
    dl.href = url;
    dl.download = filename;
    dl.style.display = 'block';

    document.getElementById('recordScreen').style.display = 'none';
    document.getElementById('doneScreen').style.display = 'flex';
  }

  function resetApp() {
    elapsed = 0;
    tapCount = 0;
    chunks = [];
    document.getElementById('doneScreen').style.display = 'none';
    document.getElementById('downloadLink').style.display = 'none';
    document.getElementById('recordScreen').style.display = 'none';
    document.getElementById('setupScreen').style.display = 'flex';
    document.getElementById('hud').classList.remove('visible');
    // Reset overlay listener
    const ov = document.getElementById('darkOverlay');
    ov.replaceWith(ov.cloneNode(true));
  }

  // Cegah layar sleep (jika browser support)
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch(e) {}
  }
  document.addEventListener('visibilitychange', async () => {
    if (wakeLock && document.visibilityState === 'visible') {
      await requestWakeLock();
    }
  });
</script>
</body>
</html>
